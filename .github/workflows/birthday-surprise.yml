# ═══════════════════════════════════════════════════════════════
#  💌 Birthday Surprise Messenger
#
#  Sends Aeshu the website link by EMAIL and SMS, one hour before
#  her birthday begins — automatically, from GitHub's servers.
#
#  Everything personal (her email, her number, your passwords)
#  lives in GitHub SECRETS — never in this public file.
#
#  📖 Full step-by-step setup: see NOTIFICATIONS_SETUP.md
#     (secrets to add, how to set the time, how to test safely)
# ═══════════════════════════════════════════════════════════════

name: 💌 Birthday Surprise Messenger

on:
  schedule:
    # ─────────────────────────────────────────────────────
    # TODO: SET THE SEND TIME — GitHub cron runs in UTC!
    #
    # India (IST) is UTC+5:30. "One hour before her birthday"
    # means 11:00 PM IST the NIGHT BEFORE, which is 17:30 UTC.
    # GitHub can delay scheduled runs by a few minutes, so we
    # schedule ~15 min early (17:15 UTC ≈ 10:45 PM IST).
    #
    # Format:  minute hour day-of-month month *
    # Example: birthday 18 January → send on 17 Jan evening:
    #     - cron: '15 17 17 1 *'
    #
    # 👇 CHANGE THIS LINE (placeholder = 24 Dec, 17:15 UTC):
    - cron: '15 17 24 12 *'
    # ─────────────────────────────────────────────────────

  # Manual "Run workflow" button in the Actions tab — use it to
  # TEST by sending to YOURSELF first (fill in these overrides).
  workflow_dispatch:
    inputs:
      test_email:
        description: 'TEST ONLY: send the email here instead of her'
        required: false
        default: ''
      test_phone:
        description: 'TEST ONLY: send the SMS here instead (+91XXXXXXXXXX)'
        required: false
        default: ''

jobs:
  send-love:
    runs-on: ubuntu-latest
    steps:
      # ── 1. EMAIL 💌 (Gmail + app password) ──────────────
      - name: Send her the email 💌
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          HER_EMAIL: ${{ inputs.test_email || secrets.HER_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python3 - <<'PY'
          import os, smtplib, sys, textwrap
          from email.message import EmailMessage
          from email.utils import formataddr

          user = os.environ.get("MAIL_USERNAME", "").strip()
          pwd  = os.environ.get("MAIL_APP_PASSWORD", "").strip()
          to   = os.environ.get("HER_EMAIL", "").strip()
          site = os.environ.get("SITE_URL", "").strip()

          if not (user and pwd and to and site):
              print("::notice::Email skipped — add the MAIL_USERNAME, "
                    "MAIL_APP_PASSWORD, HER_EMAIL and SITE_URL secrets to enable it.")
              sys.exit(0)

          msg = EmailMessage()
          msg["Subject"] = "Something magical unlocks for you at midnight… 💛"
          msg["From"] = formataddr(("Soham 💛", user))
          msg["To"] = to

          msg.set_content(textwrap.dedent(f"""\
              Aeshu,

              In one hour, it is officially YOUR day.

              I built something for you — open it now and watch it
              count down to midnight:

              {site}

              With all my love,
              Soham 💛
          """))

          msg.add_alternative(f"""\
          <div style="background:#100a10;padding:40px 16px;font-family:Georgia,serif;text-align:center;">
            <p style="color:#f2a0b0;letter-spacing:4px;font-size:12px;text-transform:uppercase;">
              For the love of my life
            </p>
            <h1 style="color:#f5c842;font-size:28px;margin:16px 0;">
              Aeshu, in one hour… it's officially your day 💛
            </h1>
            <p style="color:#e8d5c4;font-size:16px;line-height:1.7;max-width:420px;margin:0 auto 28px;">
              I made something for you. Open it now and watch it
              count down to midnight — that's when the magic begins.
            </p>
            <a href="{site}"
               style="display:inline-block;background:#f5c842;color:#100a10;text-decoration:none;
                      padding:14px 34px;border-radius:999px;font-size:16px;font-weight:bold;">
              Open your surprise 🎁
            </a>
            <p style="color:#e8d5c4;font-size:14px;margin-top:32px;font-style:italic;">
              With all my love, always —<br>Soham 💛
            </p>
          </div>
          """, subtype="html")

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pwd)
              s.send_message(msg)
          print("💌 Email delivered to her inbox!")
          PY

      # ── 2. SMS 📱 (Twilio) — runs even if the email failed ──
      - name: Send her the SMS 📱
        if: ${{ always() }}
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          HER_PHONE_NUMBER: ${{ inputs.test_phone || secrets.HER_PHONE_NUMBER }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$TWILIO_AUTH_TOKEN" ] || \
             [ -z "$TWILIO_FROM_NUMBER" ] || [ -z "$HER_PHONE_NUMBER" ] || [ -z "$SITE_URL" ]; then
            echo "::notice::SMS skipped — add the TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, HER_PHONE_NUMBER and SITE_URL secrets to enable it."
            exit 0
          fi

          BODY="Aeshu 💛 In one hour it's officially YOUR day. I made something for you — open it now and watch it unlock at midnight: $SITE_URL — all my love, Soham"

          RESPONSE=$(curl -s -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
            --data-urlencode "To=$HER_PHONE_NUMBER" \
            --data-urlencode "From=$TWILIO_FROM_NUMBER" \
            --data-urlencode "Body=$BODY" \
            -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN")

          if echo "$RESPONSE" | grep -q '"error_code": *null'; then
            echo "📱 SMS is on its way to her phone!"
          else
            echo "Twilio said: $RESPONSE"
            echo "::error::SMS failed — check the Twilio secrets and that the number is in +91XXXXXXXXXX format."
            exit 1
          fi
